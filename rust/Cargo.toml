[package]
name = "jello-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A browser and native Jellyfish evaluator for Jello"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
num-bigint = "=0.4.6"
num-integer = "=0.1.46"
num-traits = "=0.2.19"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["arbitrary_precision"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
